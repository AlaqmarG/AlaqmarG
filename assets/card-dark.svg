<text x="460" y="214" class="mono" font-size="9" fill="#7C7368" letter-spacing="1.5">YEARS SHIPPING</text>
<text x="662" y="194" class="serif" font-size="27" font-weight="700" fill="#F0876B" text-anchor="start" opacity="0">71.1M<animate attributeName="opacity" values="1;1" begin="1.08s" dur="0.08s"/></text><text x="662" y="194" class="serif" font-size="27" font-weight="700" fill="#F0876B" text-anchor="start" opacity="0">128.0M<animate attributeName="opacity" values="1;1" begin="1.16s" dur="0.08s"/></text><text x="662" y="194" class="serif" font-size="27" font-weight="700" fill="#F0876B" text-anchor="start" opacity="0">172.4M<animate attributeName="opacity" values="1;1" begin="1.24s" dur="0.08s"/></text><text x="662" y="194" class="serif" font-size="27" font-weight="700" fill="#F0876B" text-anchor="start" opacity="0">205.7M<animate attributeName="opacity" values="1;1" begin="1.32s" dur="0.08s"/></text><text x="662" y="194" class="serif" font-size="27" font-weight="700" fill="#F0876B" text-anchor="start" opacity="0">229.5M<animate attributeName="opacity" values="1;1" begin="1.40s" dur="0.08s"/></text><text x="662" y="194" class="serif" font-size="27" font-weight="700" fill="#F0876B" text-anchor="start" opacity="0">245.5M<animate attributeName="opacity" values="1;1" begin="1.48s" dur="0.08s"/></text><text x="662" y="194" class="serif" font-size="27" font-weight="700" fill="#F0876B" text-anchor="start" opacity="0">255.3M<animate attributeName="opacity" values="1;1" begin="1.56s" dur="0.08s"/></text><text x="662" y="194" class="serif" font-size="27" font-weight="700" fill="#F0876B" text-anchor="start" opacity="0">260.2M<animate attributeName="opacity" values="1;1" begin="1.64s" dur="0.08s"/></text><text x="662" y="194" class="serif" font-size="27" font-weight="700" fill="#F0876B" text-anchor="start" opacity="0">262.1M<animate attributeName="opacity" values="1;1" begin="1.72s" dur="0.08s"/></text><text x="662" y="194" class="serif" font-size="27" font-weight="700" fill="#F0876B" text-anchor="start" opacity="0">262.3M<animate attributeName="opacity" to="1" begin="1.80s" dur=".1s" fill="freeze"/></text>
<text x="662" y="214" class="mono" font-size="9" fill="#7C7368" letter-spacing="1.5">LIFETIME VISITS</text>
