  <text x="48" y="90" class="serif" font-size="38" font-weight="700" fill="#F2EDE4" letter-spacing="-.6">Alaqmar Gandhi</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin=".5s" fill="freeze"/>
  <text x="48" y="116" class="sans" font-size="14" fill="#B8AFA2">Recruited by a London studio three weeks before my first university lecture.</text>
  <text x="48" y="134" class="sans" font-size="14" fill="#B8AFA2">Still going — six shipped titles, and one game that never came out.</text></g>
