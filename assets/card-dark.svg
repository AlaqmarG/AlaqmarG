<svg xmlns="http://www.w3.org/2000/svg" width="900" height="322" viewBox="0 0 900 322" role="img" aria-label="Alaqmar Gandhi — game developer, platform engineer, live-ops. 262.3M lifetime visits across 6 shipped titles, six studios, three years. Landvault, Boltable, Shiloh and Bros and Hi-Fun on the games track; Royal Bank of Canada on the platform track. Hi-Fun overlapped RBC, and Eterna Online and RBC are both current.">
<defs><style>.serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
