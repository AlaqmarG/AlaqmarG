<text x="48" y="214" class="mono" font-size="9" fill="#7C7368" letter-spacing="1.5">SHIPPED TITLES</text>
<text x="258" y="194" class="serif" font-size="27" font-weight="700" fill="#7BA3CE">5</text>
<text x="258" y="214" class="mono" font-size="9" fill="#7C7368" letter-spacing="1.5">GAME STUDIOS</text>
