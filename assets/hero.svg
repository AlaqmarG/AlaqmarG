<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Alaqmar Gandhi — Game Developer, Platform Engineer, Live-Ops. 3 years shipping, 6 studios, 6 shipped titles, 260.5M lifetime visits.">
<defs>
  <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22D3EE"/><stop offset="35%" stop-color="#A78BFA"/>
    <stop offset="70%" stop-color="#34D399"/><stop offset="100%" stop-color="#22D3EE"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
    <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#1B2130" stroke-width="1"/>
  </pattern>
  <clipPath id="panelClip"><rect x="1" y="1" width="898" height="318" rx="16"/></clipPath>
  <clipPath id="typeCmd"><rect x="0" y="58" width="0" height="32"><animate attributeName="width" dur="0.85s" begin="0.3s" fill="freeze" calcMode="discrete" values="0;30;48;66;84;102;120;138;156;174;198"/></rect></clipPath>
  <clipPath id="typeRole"><rect x="0" y="176" width="0" height="30"><animate attributeName="width" from="0" to="540" dur="1.5s" begin="2.0s" fill="freeze"/></rect></clipPath>
  <style>.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace}
.sans{font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
    .blink{animation:blink 1.06s step-end infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .breathe{animation:breathe 3.4s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
  </style>
</defs>
<g clip-path="url(#panelClip)">
  <rect width="900" height="320" fill="#0B0E14"/>
  <rect width="900" height="320" fill="url(#grid)"/>
  <rect x="-100" y="-120" width="1100" height="120" fill="url(#scan)">
    <animate attributeName="y" from="-120" to="320" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="900" height="34" fill="#0E1219"/>
  <line x1="0" y1="34" x2="900" y2="34" stroke="#1B2130"/>
  <circle cx="22" cy="17" r="5" fill="#FB7185"/><circle cx="40" cy="17" r="5" fill="#FBBF24"/><circle cx="58" cy="17" r="5" fill="#34D399"/>
  <text x="82" y="21" class="mono" font-size="11.5" fill="#5B6472">alaqmar@career — zsh</text>
  <g class="breathe"><circle cx="826" cy="17" r="3.5" fill="#34D399"/><text x="838" y="21" class="mono" font-size="11" fill="#34D399">LIVE</text></g>

  <text x="30" y="80" class="mono" font-size="14" fill="#34D399">~ $</text>
  <g clip-path="url(#typeCmd)"><text x="64" y="80" class="mono" font-size="14" fill="#E6EDF3">whoami --verbose</text></g>
  <rect x="205" y="68" width="8" height="15" fill="#22D3EE" class="blink"/>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.25s" fill="freeze"/>
    <text x="30" y="152" class="sans" font-size="54" font-weight="800" letter-spacing="-1.5" fill="none" stroke="#22D3EE" stroke-opacity=".18" stroke-width="6" stroke-linejoin="round">ALAQMAR GANDHI</text>
    <text x="30" y="152" class="sans" font-size="54" font-weight="800" letter-spacing="-1.5" fill="url(#nameGrad)">ALAQMAR GANDHI</text>
  </g>

  <g clip-path="url(#typeRole)">
    <text x="31" y="196" class="mono" font-size="16.5" fill="#8B95A5">Game Developer<tspan fill="#2F3846"> · </tspan><tspan fill="#A78BFA">Platform Engineer</tspan><tspan fill="#2F3846"> · </tspan><tspan fill="#34D399">Live-Ops</tspan></text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="3.4s" fill="freeze"/>
    <line x1="30" y1="228" x2="870" y2="228" stroke="#1B2130"/>
    <g class="mono" font-size="10.5" fill="#5B6472" letter-spacing="1.4">
      <text x="30" y="258">YEARS SHIPPING</text><text x="242" y="258">STUDIOS</text>
      <text x="440" y="258">SHIPPED TITLES</text><text x="672" y="258">LIFETIME VISITS</text>
    </g>
    <g class="sans" font-size="34" font-weight="700">
      <text x="30" y="296" fill="#22D3EE">3</text><text x="242" y="296" fill="#A78BFA">6</text><text x="440" y="296" fill="#34D399">6</text>
      <text x="672" y="296" fill="#FBBF24" opacity="0" xml:space="preserve"> 64.8M<animate attributeName="opacity" values="1;1" begin="3.60s" dur="0.10s"/></text>
      <text x="672" y="296" fill="#FBBF24" opacity="0" xml:space="preserve">117.8M<animate attributeName="opacity" values="1;1" begin="3.70s" dur="0.10s"/></text>
      <text x="672" y="296" fill="#FBBF24" opacity="0" xml:space="preserve">160.3M<animate attributeName="opacity" values="1;1" begin="3.80s" dur="0.10s"/></text>
      <text x="672" y="296" fill="#FBBF24" opacity="0" xml:space="preserve">193.4M<animate attributeName="opacity" values="1;1" begin="3.90s" dur="0.10s"/></text>
      <text x="672" y="296" fill="#FBBF24" opacity="0" xml:space="preserve">218.3M<animate attributeName="opacity" values="1;1" begin="4.00s" dur="0.10s"/></text>
      <text x="672" y="296" fill="#FBBF24" opacity="0" xml:space="preserve">236.1M<animate attributeName="opacity" values="1;1" begin="4.10s" dur="0.10s"/></text>
      <text x="672" y="296" fill="#FBBF24" opacity="0" xml:space="preserve">248.0M<animate attributeName="opacity" values="1;1" begin="4.20s" dur="0.10s"/></text>
      <text x="672" y="296" fill="#FBBF24" opacity="0" xml:space="preserve">255.3M<animate attributeName="opacity" values="1;1" begin="4.30s" dur="0.10s"/></text>
      <text x="672" y="296" fill="#FBBF24" opacity="0" xml:space="preserve">259.0M<animate attributeName="opacity" values="1;1" begin="4.40s" dur="0.10s"/></text>
      <text x="672" y="296" fill="#FBBF24" opacity="0" xml:space="preserve">260.3M<animate attributeName="opacity" values="1;1" begin="4.50s" dur="0.10s"/></text>
      <text x="672" y="296" fill="#FBBF24" opacity="0" xml:space="preserve">260.5M<animate attributeName="opacity" to="1" begin="4.60s" dur="0.1s" fill="freeze"/></text>
    </g>
  </g>
</g>
<rect x="0.5" y="0.5" width="899" height="319" rx="16" fill="none" stroke="#222A38"/>
</svg>