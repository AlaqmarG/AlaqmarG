  <text x="56" y="54" class="mono" font-size="10" fill="#C8912F" letter-spacing="2.6">GAME DEVELOPER &#183; PLATFORM ENGINEER &#183; LIVE-OPS</text>
  <text x="56" y="100" class="serif" font-size="42" font-weight="700" fill="#1B1A17" letter-spacing="-.6">Alaqmar Gandhi</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin=".5s" fill="freeze"/>
  <text x="56" y="128" class="sans" font-size="14" fill="#5F5849">Recruited by a London studio three weeks before my first university lecture.</text>
  <text x="56" y="148" class="sans" font-size="14" fill="#5F5849">Still going — six shipped titles, and one game that never came out.</text></g>
