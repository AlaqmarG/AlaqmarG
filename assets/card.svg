reeze"/></text>
<text x="56" y="230" class="mono" font-size="9" fill="#A2988A" letter-spacing="1.5">LIFETIME VISITS</text>
<text x="258" y="210" class="serif" font-size="30" font-weight="700" fill="#3F9B7E">6</text>
<text x="258" y="230" class="mono" font-size="9" fill="#A2988A" letter-spacing="1.5">SHIPPED TITLES</text>
<text x="460" y="210" class="serif" font-size="30" font-weight="700" fill="#46688F">6</text>
